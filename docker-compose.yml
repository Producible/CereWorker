services:
  cerebellum:
    build:
      context: ./cerebellum
      dockerfile: Dockerfile
      additional_contexts:
        proto: ./proto
    ports:
      - "50051:50051"
    volumes:
      - cerebellum-models:/root/.cache/huggingface  # persist downloaded model weights
      - cerebellum-checkpoints:/checkpoints          # persist fine-tuned adapters/weights
      - cerebellum-data:/data                        # training data staging
      - ./:/workspace:ro                             # read-only access for tool verification
      - ~/.cereworker/memory:/memory:ro               # read-only access for memory verification
    environment:
      - MODEL_PATH=Qwen/Qwen3-0.6B
      - HEARTBEAT_INTERVAL=30
      - CEREBELLUM_PORT=50051
      - WORKSPACE_DIR=/workspace
      - MEMORY_DIR=/memory
      - CHECKPOINT_DIR=/checkpoints
      - DATA_DIR=/data
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

volumes:
  cerebellum-models:
  cerebellum-checkpoints:
  cerebellum-data:
