name: Install Smoke

# Validates the floating :latest npm package and Docker image on a daily cron
# (regression catch) and on manual dispatch. Tag-time validation lives inside
# the Publish workflow (.github/workflows/publish.yml) right after each push,
# so we don't race the publish jobs that produce the artifacts being smoked.
on:
  workflow_dispatch:
    inputs:
      package_spec:
        description: npm package spec to install
        required: false
        default: '@producible/cereworker@latest'
  schedule:
    - cron: '0 10 * * *'

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CEREWORKER_PACKAGE_SPEC: ${{ inputs.package_spec || '@producible/cereworker@latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run install smoke
        run: bash scripts/e2e/install-smoke.sh

  docker-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Pull Cerebellum image
        run: docker pull producible/cereworker-cerebellum:latest

      - name: Validate image runtime dependencies
        run: |
          docker run --rm --entrypoint python producible/cereworker-cerebellum:latest -c \
            "import grpc, transformers, torch; print('cerebellum-image-ok')"
