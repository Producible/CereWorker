name: Install Smoke

on:
  workflow_dispatch:
    inputs:
      package_spec:
        description: npm package spec to install
        required: false
        default: '@producible/cereworker@latest'
  schedule:
    - cron: '0 10 * * *'
  push:
    tags:
      - 'v*'

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # On tag pushes (v26.329.13), install that exact version from npm
      CEREWORKER_PACKAGE_SPEC: ${{ inputs.package_spec || '@producible/cereworker@latest' }}
      CEREWORKER_TAG_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run install smoke
        run: bash scripts/e2e/install-smoke.sh

  docker-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CEREWORKER_TAG_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

    steps:
      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${CEREWORKER_TAG_VERSION}" ]; then
            # github.ref_name on tags is e.g. v26.520.3 — strip the leading v.
            echo "image=producible/cereworker-cerebellum:${CEREWORKER_TAG_VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            echo "image=producible/cereworker-cerebellum:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Cerebellum image
        run: docker pull ${{ steps.tag.outputs.image }}

      - name: Validate image runtime dependencies
        run: |
          docker run --rm --entrypoint python ${{ steps.tag.outputs.image }} -c \
            "import grpc, transformers, torch; print('cerebellum-image-ok')"
