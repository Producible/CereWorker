name: Install Smoke

on:
  workflow_dispatch:
    inputs:
      package_spec:
        description: npm package spec to install
        required: false
        default: '@producible/cereworker@latest'
  schedule:
    - cron: '0 10 * * *'
  push:
    tags:
      - 'v*'

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # On tag pushes (v26.329.13), install that exact version from npm
      CEREWORKER_PACKAGE_SPEC: ${{ inputs.package_spec || '@producible/cereworker@latest' }}
      CEREWORKER_TAG_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run install smoke
        run: bash scripts/e2e/install-smoke.sh

  docker-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Pull Cerebellum image
        run: docker pull producible/cereworker-cerebellum:latest

      - name: Validate image runtime dependencies
        run: |
          docker run --rm --entrypoint python producible/cereworker-cerebellum:latest -c \
            "import grpc, transformers, torch; print('cerebellum-image-ok')"
