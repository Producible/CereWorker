name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Service integration smoke
        run: pnpm test:e2e:integration

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm registry propagation
        env:
          PKG_VERSION: ${{ github.ref_name }}
        run: |
          # npm registry is eventually consistent — after pnpm publish returns,
          # each of the published workspace packages can take 5-60s to become
          # queryable, and they lag independently. install-smoke runs
          # `npm install` which resolves the CLI's internal deps, so we have to
          # wait for ALL published workspace packages, not just the CLI.
          #
          # Single global retry loop instead of per-package nested loops:
          # 8 × 15s ≈ 2.5min worst case, well under publish-npm's 15min job
          # timeout even when many packages lag at once.
          VER="${PKG_VERSION#v}"
          PACKAGES=$(pnpm -r ls --depth=-1 --json \
            | jq -r '.[] | select(.private != true and .name != null) | .name')
          if [ -z "$PACKAGES" ]; then
            echo "No published workspace packages discovered — pnpm output:" >&2
            pnpm -r ls --depth=-1 --json >&2
            exit 1
          fi
          echo "Polling for ${VER} on:"
          echo "$PACKAGES" | sed 's/^/  - /'
          for attempt in 1 2 3 4 5 6 7 8; do
            missing=""
            for pkg in $PACKAGES; do
              if ! npm view "${pkg}@${VER}" version >/dev/null 2>&1; then
                missing="${missing} ${pkg}"
              fi
            done
            if [ -z "$missing" ]; then
              echo "All workspace packages propagated."
              exit 0
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "Packages still missing after 2min:${missing}" >&2
              exit 1
            fi
            echo "Attempt ${attempt}: still missing:${missing}"
            echo "Waiting 15s..."
            sleep 15
          done

      - name: Validate published npm package
        env:
          CEREWORKER_TAG_VERSION: ${{ github.ref_name }}
        run: bash scripts/e2e/install-smoke.sh

  check-docker-changes:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Cerebellum/proto changes since last tag
        id: diff
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$PREV_TAG"..HEAD -- \
            cerebellum/ proto/ packages/cerebellum-client/proto/)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish-docker:
    needs: check-docker-changes
    if: needs.check-docker-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push CPU image
        run: |
          docker build \
            --build-arg CEREWORKER_VERSION=${{ steps.version.outputs.version }} \
            -t producible/cereworker-cerebellum:latest \
            -t producible/cereworker-cerebellum:${{ steps.version.outputs.version }} \
            -f cerebellum/Dockerfile .
          docker push producible/cereworker-cerebellum:latest
          docker push producible/cereworker-cerebellum:${{ steps.version.outputs.version }}

      - name: Validate pushed CPU image
        run: |
          docker pull producible/cereworker-cerebellum:${{ steps.version.outputs.version }}
          docker run --rm --entrypoint python \
            producible/cereworker-cerebellum:${{ steps.version.outputs.version }} -c \
            "import grpc, transformers, torch; print('cerebellum-image-ok')"

      - name: Build and push GPU image
        run: |
          docker build \
            --build-arg CEREWORKER_VERSION=${{ steps.version.outputs.version }} \
            -t producible/cereworker-cerebellum:gpu \
            -t producible/cereworker-cerebellum:${{ steps.version.outputs.version }}-gpu \
            -f cerebellum/Dockerfile.gpu .
          docker push producible/cereworker-cerebellum:gpu
          docker push producible/cereworker-cerebellum:${{ steps.version.outputs.version }}-gpu
