name: Test Cerebellum Image Build

on:
  push:
    branches: [main]
    paths:
      - 'cerebellum/**'
      - 'proto/**'
      - '.github/workflows/cerebellum-image.yml'
  pull_request:
    paths:
      - 'cerebellum/**'
      - 'proto/**'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/build-push-action@v5
        with:
          context: ./cerebellum
          file: ./cerebellum/Dockerfile
          build-contexts: proto=./proto
          push: false
          tags: cereworker-cerebellum:latest
