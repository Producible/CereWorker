name: Build Cerebellum Image

on:
  push:
    branches: [main]
    paths:
      - 'cerebellum/**'
      - 'proto/**'
      - '.github/workflows/cerebellum-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: producible/cereworker-cerebellum

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YY.MMDD'}}.{{sha}}

      - uses: docker/build-push-action@v5
        with:
          context: ./cerebellum
          file: ./cerebellum/Dockerfile
          build-contexts: proto=./proto
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
