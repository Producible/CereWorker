name: Skill Request
description: Request a new skill for CereWorker
labels: ["skill"]
body:
  - type: markdown
    attributes:
      value: |
        Request a new SKILL.md for the [cereworker-skills](https://github.com/Producible/cereworker-skills) registry.

  - type: input
    id: name
    attributes:
      label: Skill name
      placeholder: "e.g. instagram, aws-deploy, jira"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What should it do?
      description: Describe the tasks this skill should handle
    validations:
      required: true

  - type: textarea
    id: tools
    attributes:
      label: Tools / APIs involved
      description: What tools, CLIs, or APIs would this skill use?
      placeholder: |
        - httpFetch for REST API calls
        - shell for CLI tool
        - browser for web UI
    validations:
      required: false
